<style>
/* Layout: phone-style mail client — header + tabs, grouped conversation list, conversation view with expandable messages, bottom nav */
:root{
  --bg:#ffffff; --bar:#f5f6f8; --line:#e4e6ea; --seg:#e6e8ec; --seg-on:#ffffff;
  --fg:#1b1b1f; --muted:#6b6f78; --accent:#0f6cbd; --badge:#eceef1; --card:#ffffff;
  --font:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bar:#1c1c1e; --line:#2c2c2e; --seg:#2a2a2c; --seg-on:#3a3a3d;
  --fg:#f2f2f4; --muted:#9a9aa1; --accent:#4f9ff0; --badge:#2c2c2e; --card:#141416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bar:#1c1c1e; --line:#2c2c2e; --seg:#2a2a2c; --seg-on:#3a3a3d;
  --fg:#f2f2f4; --muted:#9a9aa1; --accent:#4f9ff0; --badge:#2c2c2e; --card:#141416; color-scheme:dark}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}

.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow:auto;min-height:0}

/* list header */
.hdr{background:var(--bar);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
.hdr-row{display:flex;align-items:center;gap:12px}
.hdr h1{font-size:28px;font-weight:700;margin:0;flex:1}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}
.tabs-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;font-size:16px;color:var(--fg)}
.seg button.on{background:var(--seg-on);font-weight:700}
.filter{display:flex;align-items:center;gap:6px;font-size:16px}

.group{padding:18px 16px 6px;color:var(--muted);font-size:15px}
.conv{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.conv:active{background:var(--bar)}
.c-main{min-width:0;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.c-from{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-time{font-size:14px;color:var(--muted);align-self:center}
.c-subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-meta{display:flex;align-items:center;gap:8px;color:var(--muted)}
.count{background:var(--badge);border-radius:6px;font-size:13px;padding:1px 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-prev{grid-column:1/3;color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conv.unread .c-from{font-weight:700}
.conv.unread .c-subj{color:var(--accent);font-weight:700}
.conv{position:relative}
.conv.unread::before{content:"";position:absolute;left:4px;top:50%;width:4px;height:36px;margin-top:-18px;border-radius:2px;background:var(--accent)}
.m-body a{color:var(--accent);overflow-wrap:anywhere}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.more{display:block;padding:18px 16px;color:var(--accent);font-size:16px}

.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.av.sm{width:36px;height:36px;font-size:14px}
.av.me{background:#3b7fd4}
.av.y{background:#4a90d9}

/* conversation view */
.thdr{background:var(--bar);padding:calc(10px + env(safe-area-inset-top,0px)) 8px 14px;display:flex;flex-direction:column;gap:8px}
.thdr .bar{display:flex;align-items:center;justify-content:space-between}
.thdr h2{margin:0 8px;font-size:19px;line-height:1.45;font-weight:700;text-wrap:balance}
.msgs{display:flex;flex-direction:column}
.msg{border-bottom:8px solid var(--bar)}
.msg:last-child{border-bottom:0}
.m-head{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:16px 16px 8px}
.m-who{min-width:0}
.m-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-to,.m-prev{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-time{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.msg.open .m-prev{display:none}
.msg:not(.open) .m-to{display:none}
.m-body{display:none;padding:4px 16px 16px 58px;line-height:1.85;font-size:15px}
.msg.open .m-body{display:block}
.m-body p{margin:0 0 12px;overflow-wrap:anywhere}
.attach{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.attach span{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.tag{font-size:12px;color:var(--accent);margin-left:6px;font-weight:400}

/* bottom nav + fab */
.fab{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;background:var(--bar);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bar);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--accent)}
.toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
@media (max-width:360px){.m-body{padding-left:16px}}
@media (prefers-reduced-motion:no-preference){.msg{transition:border-color .15s}}
</style>

</head>
<body>

    <button class="on" id="navMail"><svg width="30" height="24" viewBox="0 0 30 24"><rect x="1" y="2" width="28" height="20" rx="3" fill="currentColor"/><path d="M2 5l13 9 13-9" fill="none" stroke="var(--bar)" stroke-width="2"/></svg>郵件</button>
    <button class="soon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/><text x="12" y="18.5" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui">13</text></svg>行事曆</button>
    <button class="soon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>應用程式</button>
  </nav>
</div>

];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flat = b => b.join(" ").replace(/\n/g," ");
let tab = "focus";

function renderList(){
  const items = convs.filter(c => (tab==="focus") === c.focus);
  if(!items.length){ $("list").innerHTML = '<div class="empty">這裡沒有郵件</div>'; return; }
  let html = "", g = null;
  items.forEach(c=>{
    if(c.group!==g){ g=c.group; html += `<div class="group">${esc(g)}</div>`; }
    const lastIn = [...c.msgs].reverse().find(m=>m.from!==ME) || c.msgs[c.msgs.length-1];
    html += `<button class="conv${c.unread?" unread":""}" data-id="${c.id}">
      <span class="av" style="background:${lastIn.from.color}">${esc(lastIn.from.ini)}</span>
      <span class="c-main">
        <span class="c-from">${esc(lastIn.from.name)}</span><span class="c-time">${esc(c.listTime)}</span>
        <span class="c-subj">${esc(c.subj)}</span>
        <span class="c-meta">${c.replied?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="已回覆"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/></svg>':""}${c.msgs.length>1?`<span class="count">${c.msgs.length}</span>`:""}</span>
        <span class="c-prev">${esc(flat(lastIn.body))}</span>
      </span></button>`;
  });
  html += '<span class="more">載入更多交談</span>';
  $("list").innerHTML = html;
}

function openConv(id){
  const c = convs.find(x=>x.id===id);
  c.unread = false; renderList();
  $("tSubj").textContent = c.subj;
  $("msgs").innerHTML = c.msgs.map((m,i)=>`
    <article class="msg open">
      <div class="m-head">
        <span class="av sm" style="background:${m.from.color}">${esc(m.from.ini)}</span>
        <span class="m-who">
          <span class="m-name" style="display:block">${esc(m.from.name)}${m.from===ME?'<span class="tag">已傳送</span>':""}</span>
          <span class="m-to" style="display:block">收件者：${esc(m.to)}</span>
          <span class="m-prev" style="display:block">${esc(flat(m.body))}</span>
        </span>
        <span class="m-time">${esc(m.time)}</span>
      </div>
      <div class="m-body">${m.body.map(p=>`<p>${esc(p).replace(/https?:\/\/[^\s<（）]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\n/g,"<br>")}</p>`).join("")}
        ${m.attach?`<div class="attach">${m.attach.map(a=>`<span>📎 ${esc(a)}</span>`).join("")}</div>`:""}
      </div>
    </article>`).join("");
  $("listView").hidden = true; $("threadView").hidden = false; $("fab").hidden = true;
  $("threadView").querySelector(".scroll").scrollTop = 0;
}

$("list").onclick = e => { const b=e.target.closest(".conv"); if(b) openConv(+b.dataset.id); };
$("back").onclick = () => { $("threadView").hidden = true; $("listView").hidden = false; $("fab").hidden = false; };
$("navMail").onclick = () => $("back").onclick();
$("tabFocus").onclick = () => setTab("focus");
$("tabOther").onclick = () => setTab("other");
function setTab(t){ tab=t; $("tabFocus").classList.toggle("on",t==="focus"); $("tabOther").classList.toggle("on",t==="other");
  $("tabFocus").setAttribute("aria-selected",t==="focus"); $("tabOther").setAttribute("aria-selected",t==="other"); renderList(); }
renderList();
</script>

</body>
</html>
